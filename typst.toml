[package]
name = "mlatlas"
version = "0.3.0"
entrypoint = "lib.typ"
authors = ["J.C. Vaught <jvaught@sc.edu>"]
license = "MIT"
description = "Declarative machine-learning, neural-network and AI diagrams for Typst: rectangular, high-contrast house style by default, fully customizable, with escape hatches down to raw fletcher/cetz."
repository = "https://github.com/j-vaught/mlatlas"
homepage = "https://github.com/j-vaught/mlatlas"
keywords = ["diagram", "neural-network", "machine-learning", "transformer", "deep-learning", "figure"]
categories = ["visualization"]
compiler = "0.13.0"
exclude = ["examples", "media", "docs", "*.pdf", "*.png"]
